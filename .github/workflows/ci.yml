name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install --yes glib2.0-bin zip

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Use stable Rust
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Require changelog for the package version
        run: python3 scripts/release-notes.py > /dev/null

      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Test Hyprland integration on a private D-Bus
        run: make test-hyprland

      - name: Check installer syntax
        run: sh -n scripts/install-user.sh scripts/install-release-user.sh scripts/build-release-packages.sh

      - name: Check GNOME JavaScript
        run: node --check extension/extension.js && node --check extension/prefs.js

      - name: Check GSettings schemas
        run: glib-compile-schemas --strict --dry-run extension/schemas

      - name: Build release binary and extension
        run: cargo build --release --locked && ./scripts/package-extension.sh

      - name: Verify extension archive
        run: unzip -t dist/agent-notifier@mmmohebi.github.io.zip
